<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحكم بوت IMVU</title>
    <!-- تضمين مكتبة التصميم السريع -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-sm text-center">
        <h1 class="text-xl font-bold mb-4">لوحة تحكم البوت 🤖</h1>
        
        <!-- تشغيل وإيقاف البوت -->
        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg mb-4">
            <span class="font-medium">تشغيل البوت:</span>
            <input type="checkbox" id="botToggle" class="w-6 h-6 accent-blue-600">
        </div>
        
        <!-- رسالة الترحيب بالزوار -->
        <textarea id="welcomeMsg" class="w-full p-2 border rounded-lg text-right mb-4 focus:ring-2 focus:ring-blue-500" placeholder="اكتب رسالة الترحيب هنا..."></textarea>
        
        <!-- زر الحفظ -->
        <button id="saveBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold transition">حفظ التغييرات 💾</button>
    </div>

    <!-- ربط لوحة التحكم بـ Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بمشروعك
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY", // استبدلها بـ API Key الخاص بمشروعك
            authDomain: "imvu-iq.firebaseapp.com",
            projectId: "imvu-iq",
            appId: "YOUR_APP_ID" // استبدلها بـ App ID الخاص بمشروعك
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // عند الضغط على زر الحفظ يتم إرسال البيانات فوراً لـ Firestore
        document.getElementById('saveBtn').addEventListener('click', async () => {
            const isBotActive = document.getElementById('botToggle').checked;
            const welcomeText = document.getElementById('welcomeMsg').value;
            try {
                await setDoc(doc(db, "botSettings", "config"), {
                    active: isBotActive,
                    welcomeMessage: welcomeText
                });
                alert("تم حفظ البيانات بنجاح في قاعدة البيانات! 🎉");
            } catch (e) { 
                alert("خطأ: تأكد من إعدادات الـ Config وتفعيل Firestore Rules."); 
            }
        });
    </script>
</body>
</html>
